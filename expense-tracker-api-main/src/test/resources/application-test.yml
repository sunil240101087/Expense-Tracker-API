spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

security:
  jwt:
    secret: test-secret-key-that-is-definitely-long-enough-32-bytes
    expiration-minutes: 60

app:
  seed:
    enabled: false
